<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINGAS TOWER DEFENSE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scaler">
  <div id="game-wrap">

    <!-- ===== TOP BAR ===== -->
    <div id="topbar">
      <div class="stat" id="stat-lives"><span class="ico" id="ico-lives"></span><span id="lives-val">200</span></div>
      <div class="stat" id="stat-cash"><span class="ico" id="ico-cash"></span><span id="cash-val">650</span></div>
      <div class="stat" id="stat-round"><span class="ico" id="ico-round"></span><span id="round-val">Round 0/30</span></div>
      <div class="stat" id="stat-level">
        <span class="ico" id="ico-level"></span><span id="level-val">LVL 1</span>
        <div id="xpbar"><div id="xpbar-fill"></div></div>
      </div>
      <div id="survive-wrap">
        <span class="survive-label">SURVIVE!</span>
        <span class="survive-num">0</span>
        <div id="survivebar"><div id="survivebar-fill"></div></div>
        <span class="survive-num">1</span>
      </div>
      <div class="topbar-btns">
        <button id="btn-speed" class="tb-btn" title="Game speed (F)">&#9193;1x</button>
        <button id="btn-sfx" class="tb-btn" title="Sound effects (S)">SFX</button>
        <button id="btn-music" class="tb-btn" title="Music (M)">&#9835;</button>
      </div>
    </div>

    <div id="midrow">
      <!-- ===== GAME CANVAS ===== -->
      <div id="canvas-holder">
        <canvas id="game" width="1000" height="640"></canvas>

        <!-- main menu overlay -->
        <div id="menu" class="overlay">
          <div class="menu-card">
            <canvas id="title-art" width="260" height="120"></canvas>
            <h1 class="title">PINGAS<br>TOWER DEFENSE</h1>
            <p class="subtitle">Dr. Pingas needs YOU. The blue blurs are coming.<br>Deploy the badnik brigade!</p>
            <div class="map-row">
              <button class="map-btn sel" data-map="desert">DESERT DOMAIN</button>
              <button class="map-btn" data-map="hills">GREEN HILL GAUNTLET</button>
            </div>
            <div class="diff-row">
              <button class="diff-btn" data-diff="easy">EASY<small>30 rounds &middot; 200 lives</small></button>
              <button class="diff-btn" data-diff="medium">MEDIUM<small>50 rounds &middot; 150 lives</small></button>
              <button class="diff-btn" data-diff="hard">HARD<small>67.67 rounds &middot; 100 lives</small></button>
            </div>
            <button id="btn-multi">&#128274; MULTIPLAYER</button>
            <p class="hint">Place towers &middot; pop hedgehogs &middot; unlock tier 5 &middot; freeplay to 120</p>
          </div>
        </div>

        <!-- win / lose overlay -->
        <div id="endscreen" class="overlay hidden">
          <div class="menu-card">
            <h1 class="title" id="end-title">VICTORY!</h1>
            <p id="end-stats" class="subtitle"></p>
            <div class="diff-row">
              <button id="btn-freeplay" class="diff-btn hidden">FREE PLAY<small>continue to round 120</small></button>
              <button id="btn-replay" class="diff-btn">PLAY AGAIN</button>
              <button id="btn-menu" class="diff-btn">MAIN MENU</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== SIDEBAR ===== -->
      <div id="sidebar">
        <div id="shop">
          <div class="side-title">BADNIK BRIGADE</div>
          <div id="tower-cards"></div>
        </div>

        <!-- selected tower / upgrade panel -->
        <div id="upgrade-panel" class="hidden">
          <div id="up-head">
            <canvas id="up-icon" width="48" height="48"></canvas>
            <div>
              <div id="up-name">CLUCKO</div>
              <div id="up-stats"></div>
            </div>
            <button id="up-close">&times;</button>
          </div>
          <div id="up-paths"></div>
          <div id="up-foot">
            <button id="btn-target">TARGET: FIRST</button>
            <button id="btn-sell">SELL $0</button>
          </div>
        </div>

        <div id="side-foot">
          <label id="auto-wrap"><input type="checkbox" id="chk-auto"> AUTO-START</label>
          <button id="btn-start">START ROUND</button>
        </div>
      </div>
    </div>

    <!-- toast / announcements -->
    <div id="toast" class="hidden"></div>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/map.js"></script>
<script src="js/enemies.js"></script>
<script src="js/towers.js"></script>
<script src="js/rounds.js"></script>
<script src="js/game.js"></script>
</body>
</html>
